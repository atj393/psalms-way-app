name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Jest
        run: npm test

      # Lint is reported but not gating: the repository has pre-existing
      # eslint errors (unused vars, one exhaustive-deps) that predate this
      # workflow. Fix those, then drop continue-on-error to make it gate.
      - name: Lint (non-gating)
        run: npm run lint
        continue-on-error: true
